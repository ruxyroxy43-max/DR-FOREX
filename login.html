<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RUXY Journal Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top left, #1c2845 0%, #070b12 38%, #02050b 100%);
      color: #e5e7eb;
    }
    .auth-shell {
      width: min(960px, 92vw);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(2,6,23,0.75);
    }
    .brand-panel {
      padding: 42px 38px;
      background: linear-gradient(135deg, rgba(124,58,237,0.28), rgba(6,182,212,0.12));
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .brand-panel .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      font-weight: 900;
      letter-spacing: 0.06em;
      font-size: 12px;
    }
    .brand-panel h1 {
      margin: 26px 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.05;
    }
    .brand-panel p {
      color: #cbd5e1;
      margin: 0;
      max-width: 440px;
      line-height: 1.7;
    }
    .brand-panel .admin-note {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.18);
      border: 1px solid rgba(45, 212, 191, 0.35);
      color: #a7f3d0;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .forms-panel {
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .panel-box {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px 18px;
    }
    .panel-box h2 {
      margin: 0 0 18px;
      font-size: 1.2rem;
    }
    form {
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      color: #cbd5e1;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.98rem;
      outline: none;
    }
    input:focus {
      border-color: rgba(96, 165, 250, 0.9);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    button {
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    .primary-btn {
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      color: #03161a;
    }
    .secondary-btn {
      background: rgba(124,58,237,0.18);
      color: #e9d5ff;
      border: 1px solid rgba(167, 139, 250, 0.35);
    }
    .alert {
      min-height: 22px;
      font-size: 0.82rem;
      color: #fca5a5;
      font-weight: 600;
    }
    @media (max-width: 760px) {
      .auth-shell {
        grid-template-columns: 1fr;
      }
      .brand-panel {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .brand-panel, .forms-panel {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="brand-panel">
      <div class="logo">RUXY</div>
      <h1>Welcome Back</h1>
      <p>Enter your credentials to access your trading journal and manage your trades.</p>
    </div>

    <div class="forms-panel">
      <div class="panel-box">
        <h2>Login</h2>
        <form id="login-form">
          <label>Username
            <input type="text" id="login-username" name="username" placeholder="Enter username" required>
          </label>
          <label>Password
            <input type="password" id="login-password" name="password" placeholder="Enter password" required>
          </label>
          <button type="submit" class="primary-btn">Login</button>
          <div id="login-message" class="alert"></div>
        </form>
      </div>

      <div class="panel-box">
        <h2>Create User Account</h2>
        <form id="signup-form">
          <label>Username
            <input type="text" id="signup-username" name="username" placeholder="Choose username" required>
          </label>
          <label>Email address
            <input type="email" id="signup-email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </label>
          <label>Password
            <input type="password" id="signup-password" name="password" placeholder="At least 10 characters" minlength="10" autocomplete="new-password" required>
          </label>
          <button type="submit" class="secondary-btn">Create Account</button>
          <button type="button" id="resend-verification" class="secondary-btn">Resend verification email</button>
          <div id="signup-message" class="alert"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SESSION_KEY = 'ruxy_session_v1';

    function setMessage(elementId, message, isError = true) {
      const box = document.getElementById(elementId);
      if (!box) return;
      box.textContent = message;
      box.style.color = isError ? '#fca5a5' : '#a7f3d0';
    }

    async function requestJson(url, options = {}) {
      let response;
      try {
        response = await fetch(url, {
          ...options,
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          credentials: 'same-origin'
        });
      } catch (error) {
        throw new Error('Cannot reach the account server. Start the Node.js server and open this page at http://localhost:3001/login.html. Static hosting alone cannot create accounts.');
      }
      if (!response.headers.get('content-type')?.includes('application/json')) {
        throw new Error('The account API is not available at this site. Deploy the Node.js server with the website and configure email verification.');
      }
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'The request could not be completed.');
      return result;
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Remove credentials left behind by the previous browser-only login system.
      localStorage.removeItem('ruxy_users_v1');
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');

      const verificationToken = new URLSearchParams(window.location.search).get('verify');
      if (verificationToken) {
        requestJson(`/api/auth/verify?token=${encodeURIComponent(verificationToken)}`)
          .then(result => setMessage('login-message', result.message, false))
          .catch(error => setMessage('login-message', error.message));
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const button = loginForm.querySelector('button[type="submit"]');
        button.disabled = true;
        setMessage('login-message', 'Signing in…', false);
        try {
          const result = await requestJson('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              username: document.getElementById('login-username').value.trim(),
              password: document.getElementById('login-password').value
            })
          });
          localStorage.setItem(SESSION_KEY, JSON.stringify(result.user));
          window.location.href = 'index.html';
        } catch (error) {
          setMessage('login-message', error.message);
          button.disabled = false;
        }
      });

      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const button = signupForm.querySelector('button[type="submit"]');
        button.disabled = true;
        setMessage('signup-message', 'Creating account…', false);
        try {
          const result = await requestJson('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({
              username: document.getElementById('signup-username').value.trim(),
              email: document.getElementById('signup-email').value.trim(),
              password: document.getElementById('signup-password').value
            })
          });
          setMessage('signup-message', result.message, false);
          signupForm.reset();
        } catch (error) {
          setMessage('signup-message', error.message);
        } finally {
          button.disabled = false;
        }
      });

      document.getElementById('resend-verification').addEventListener('click', async () => {
        const email = document.getElementById('signup-email').value.trim();
        if (!email) {
          setMessage('signup-message', 'Enter your email address first.');
          return;
        }
        try {
          const result = await requestJson('/api/auth/resend-verification', {
            method: 'POST',
            body: JSON.stringify({ email })
          });
          setMessage('signup-message', result.message, false);
        } catch (error) {
          setMessage('signup-message', error.message);
        }
      });
    });
  </script>
</body>
</html>
