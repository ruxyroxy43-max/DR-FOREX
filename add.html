<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Trade</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="sidebar-backdrop"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand"><div class="logo">RUXY</div><div class="brand-text">RUXY <span style="color:#9b8bff">JOURNAL</span></div></div>
      </div>
      <nav>
        <a href="index.html" class="nav-link"><span class="nav-icon dashboard-icon">⌂</span><span class="nav-label">Dashboard</span></a>
        <a href="add.html" class="nav-link add-link active"><span class="nav-icon add-icon">+</span><span class="nav-label">Add Trade</span></a>
        <a href="index.html" class="nav-link"><span class="nav-icon journal-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="12" height="16" rx="2" ry="2"/><line x1="9" y1="7" x2="15" y2="7" stroke="white" stroke-width="1.5" opacity="0.8"/><line x1="9" y1="10" x2="15" y2="10" stroke="white" stroke-width="1.5" opacity="0.8"/><line x1="9" y1="13" x2="15" y2="13" stroke="white" stroke-width="1.5" opacity="0.8"/><path d="M 16 17 L 20 14 L 22 16 L 18 19 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/></svg></span><span class="nav-label">Journal</span></a>
      </nav>
      <div class="sidebar-footer">Local-only • Vercel-ready</div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="header-title">
          <button class="menu-toggle" aria-label="Open navigation">☰</button>
          <div>
            <div class="brand"><span class="small-tag">RUXY</span> Add Trade</div>
            <p class="subtitle">Record your trade details and journal entry.</p>
          </div>
        </div>
      </header>

      <div class="add-card">
        <h2>Add Trade</h2>
        <form id="add-form">
          <label>Instrument<input name="instrument" required></label>
          <label>Direction<select name="direction"><option>LONG</option><option>SHORT</option></select></label>
          <label>Entry Price<input name="entryPrice" type="number" step="any" required></label>
          <label>Exit Price<input name="exitPrice" type="number" step="any"></label>
          <label>PnL<input name="pnl" type="number" step="any"></label>
          <label>Entry Date<input name="entryDate" type="date" required></label>
          <label>Exit Date<input name="exitDate" type="date"></label>
          <label>Notes<textarea name="notes"></textarea></label>
          <div class="modal-actions">
            <button type="submit">Save</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Navigation setup for mobile and collapse
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    const sidebarBackdrop = document.querySelector('.sidebar-backdrop');
    const sidebarClose = document.querySelector('.sidebar-close');

    function closeSidebar(){
      if(sidebar) sidebar.classList.remove('open');
      if(sidebarBackdrop) sidebarBackdrop.classList.remove('show');
      document.body.classList.remove('sidebar-open');
    }
    function openSidebar(){
      if(sidebar) sidebar.classList.add('open');
      if(sidebarBackdrop) sidebarBackdrop.classList.add('show');
      document.body.classList.add('sidebar-open');
    }
    if(menuToggle){menuToggle.addEventListener('click', ()=>{
      if(window.innerWidth > 760){
        sidebar?.classList.toggle('sidebar-collapsed');
        return;
      }
      if(sidebar?.classList.contains('open')) closeSidebar(); else openSidebar();
    });}
    if(sidebarClose){sidebarClose.addEventListener('click', closeSidebar);}
    if(sidebarBackdrop){sidebarBackdrop.addEventListener('click', closeSidebar);}
    document.querySelectorAll('.sidebar nav a, .sidebar nav button').forEach(link=>link.addEventListener('click', closeSidebar));
    window.addEventListener('resize', ()=>{ if(window.innerWidth > 760) closeSidebar(); });

    // Trade form logic
    const STORAGE_KEY = 'trade_journal_trades_v1';
    document.getElementById('add-form').addEventListener('submit', e=>{
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      data.entryPrice = data.entryPrice?Number(data.entryPrice):null;
      data.exitPrice = data.exitPrice?Number(data.exitPrice):null;
      data.pnl = data.pnl?Number(data.pnl): (data.exitPrice && data.entryPrice ? Number(data.exitPrice)-Number(data.entryPrice) : 0);
      data.entryDate = data.entryDate || new Date().toISOString();
      data.exitDate = data.exitDate || null;
      data.id = 't_'+Date.now()+Math.floor(Math.random()*999);
      try{ const arr = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); arr.push(data); localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){}
      // try server
      fetch('/api/trades',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{});
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
