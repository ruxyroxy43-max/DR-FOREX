services:
  - type: web
    name: ruxy-trade-journal
    runtime: node
    plan: starter
    buildCommand: npm install --prefix server
    startCommand: npm --prefix server start
    healthCheckPath: /health
    disk:
      name: ruxy-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
