services:
  - type: web
    name: ruxy-trade-journal
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_RELAY_URL
        sync: false
      - key: GMAIL_RELAY_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
