<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RUXY Journal Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top left, #1c2845 0%, #070b12 38%, #02050b 100%);
      color: #e5e7eb;
    }
    .auth-shell {
      width: min(960px, 92vw);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(2,6,23,0.75);
    }
    .brand-panel {
      padding: 42px 38px;
      background: linear-gradient(135deg, rgba(124,58,237,0.28), rgba(6,182,212,0.12));
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .brand-panel .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      font-weight: 900;
      letter-spacing: 0.06em;
      font-size: 12px;
    }
    .brand-panel h1 {
      margin: 26px 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.05;
    }
    .brand-panel p {
      color: #cbd5e1;
      margin: 0;
      max-width: 440px;
      line-height: 1.7;
    }
    .brand-panel .admin-note {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.18);
      border: 1px solid rgba(45, 212, 191, 0.35);
      color: #a7f3d0;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .forms-panel {
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .panel-box {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px 18px;
    }
    .panel-box h2 {
      margin: 0 0 18px;
      font-size: 1.2rem;
    }
    form {
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      color: #cbd5e1;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.98rem;
      outline: none;
    }
    input:focus {
      border-color: rgba(96, 165, 250, 0.9);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    button {
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    .primary-btn {
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      color: #03161a;
    }
    .secondary-btn {
      background: rgba(124,58,237,0.18);
      color: #e9d5ff;
      border: 1px solid rgba(167, 139, 250, 0.35);
    }
    .alert {
      min-height: 22px;
      font-size: 0.82rem;
      color: #fca5a5;
      font-weight: 600;
    }
    @media (max-width: 760px) {
      .auth-shell {
        grid-template-columns: 1fr;
      }
      .brand-panel {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .brand-panel, .forms-panel {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="brand-panel">
      <div class="logo">RUXY</div>
      <h1>Welcome Back</h1>
      <p>Enter your credentials to access your trading journal and manage your trades.</p>
    </div>

    <div class="forms-panel">
      <div class="panel-box">
        <h2>Login</h2>
        <form id="login-form">
          <label>Username
            <input type="text" id="login-username" name="username" placeholder="Enter username" required>
          </label>
          <label>Password
            <input type="password" id="login-password" name="password" placeholder="Enter password" required>
          </label>
          <button type="submit" class="primary-btn">Login</button>
          <div id="login-message" class="alert"></div>
        </form>
      </div>

      <div class="panel-box">
        <h2>Create User Account</h2>
        <form id="signup-form">
          <label>Username
            <input type="text" id="signup-username" name="username" placeholder="Choose username" required>
          </label>
          <label>Password
            <input type="password" id="signup-password" name="password" placeholder="Choose password" required>
          </label>
          <button type="submit" class="secondary-btn">Create Account</button>
          <div id="signup-message" class="alert"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const USER_KEY = 'ruxy_users_v1';
    const SESSION_KEY = 'ruxy_session_v1';

    function readUsers() {
      try {
        return JSON.parse(localStorage.getItem(USER_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function writeUsers(users) {
      localStorage.setItem(USER_KEY, JSON.stringify(users));
    }

    function normalizeUser(user) {
      return {
        ...user,
        role: user.role || 'user',
        blocked: !!user.blocked,
        verified: user.role === 'admin' ? true : user.verified !== false,
        createdAt: user.createdAt || new Date().toISOString()
      };
    }

    function ensureAdminUser() {
      const users = readUsers().map(normalizeUser);
      const admin = users.find(user => user.username.toLowerCase() === 'styve');
      if (!admin) {
        users.push({
          id: 'admin-styve',
          username: 'STYVE',
          password: 'admin',
          role: 'admin',
          blocked: false,
          verified: true,
          createdAt: new Date().toISOString()
        });
      }
      writeUsers(users);
    }

    function setMessage(elementId, message, isError = true) {
      const box = document.getElementById(elementId);
      if (!box) return;
      box.textContent = message;
      box.style.color = isError ? '#fca5a5' : '#a7f3d0';
    }

    document.addEventListener('DOMContentLoaded', () => {
      ensureAdminUser();

      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const users = readUsers().map(normalizeUser);

        if (!username || !password) {
          setMessage('login-message', 'Please enter both username and password.', true);
          return;
        }

        const found = users.find((user) => user.username === username);

        if (!found) {
          setMessage('login-message', 'Username or password is incorrect.', true);
          return;
        }

        if (found.role !== 'admin' && !found.verified) {
          setMessage('login-message', 'This account is awaiting admin verification.', true);
          return;
        }

        if (found.blocked) {
          setMessage('login-message', 'This account has been blocked by the administrator.', true);
          return;
        }

        if (found.password !== password) {
          setMessage('login-message', 'Username or password is incorrect.', true);
          return;
        }

        const session = { id: found.id, username: found.username, role: found.role };
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));

        if (found.role === 'admin') {
          window.location.href = 'admin.html';
          return;
        }

        window.location.href = 'index.html';
      });

      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('signup-username').value.trim();
        const password = document.getElementById('signup-password').value.trim();
        const users = readUsers().map(normalizeUser);

        if (!username || !password) {
          setMessage('signup-message', 'Please provide a username and password.', true);
          return;
        }

        if (username.toLowerCase() === 'styve') {
          setMessage('signup-message', 'This username is reserved for admin access.', true);
          return;
        }

        const exists = users.some((user) => user.username.toLowerCase() === username.toLowerCase());
        if (exists) {
          setMessage('signup-message', 'This username already exists. Please choose another.', true);
          return;
        }

        users.push({
          id: 'user_' + Date.now() + Math.floor(Math.random() * 999),
          username,
          password,
          role: 'user',
          blocked: false,
          verified: false,
          createdAt: new Date().toISOString()
        });

        writeUsers(users);
        setMessage('signup-message', 'Account created successfully. It is now pending admin verification.', false);
        signupForm.reset();
      });
    });
  </script>
</body>
</html>
